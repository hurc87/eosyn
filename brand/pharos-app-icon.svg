<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100">
  <!-- Pharos app icon (iOS and fallback): lighthouse with its SOS beam running off the edge.
       Full square, no rounded corners: the phone applies its own mask. -->
  <defs>
    <linearGradient id="sunrise" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0">
      <stop offset="0" stop-color="#6E4CF0"/>
      <stop offset="1" stop-color="#FF7EA6"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#sunrise)"/>
  <g fill="#FFFFFF">
    <polygon points="21,28 28,19 35,28"/>
    <rect x="20" y="29" width="16" height="12" rx="2.5"/>
    <rect x="17" y="42" width="22" height="3.5" rx="1.5"/>
    <polygon points="19,47.5 37,47.5 41,83 15,83"/>
    <rect x="12" y="84" width="32" height="6" rx="2"/>
    <circle cx="50" cy="35" r="5.5"/>
    <circle cx="64.5" cy="35" r="5.5"/>
    <circle cx="79" cy="35" r="5.5"/>
    <rect x="92.5" y="29.5" width="30" height="11" rx="5.5"/>
  </g>
</svg>
